<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テーマで探す — KIRARA MUSE</title>
  <meta name="description" content="テーマから作品や画像を探せます。自然・どうぶつ・まち・ファンタジーなど。">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .theme-section { margin-bottom: 56px; }
    .theme-section-title {
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--color-text);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .theme-section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--color-gold);
      border-radius: 2px;
    }
    .theme-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .theme-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 48px;
    }
    .theme-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 12px;
      background: var(--color-white);
      border: 1.5px solid var(--color-border);
      font-size: 0.88rem;
      color: var(--color-text-sub);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
      text-decoration: none;
    }
    .theme-nav-btn:hover {
      background: var(--color-gold-light);
      border-color: var(--color-gold);
      color: var(--color-gold);
      box-shadow: 0 2px 10px rgba(201,168,76,0.12);
    }
    .theme-count {
      font-size: 0.72rem;
      background: var(--color-gold-light);
      color: var(--color-gold);
      border-radius: 10px;
      padding: 2px 8px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        KIRARA MUSE
        <span>きらら・ミューズ</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="global-nav" id="globalNav">
        <ul>
          <li><a href="index.html">ホーム</a></li>
          <li><a href="works.html">ひらめき作品</a></li>
          <li><a href="images.html">ひらめき画像</a></li>
          <li><a href="themes.html">テーマで探す</a></li>
          <li><a href="howto.html">使い方</a></li>
          <li><a href="ai-inspiration.html">AIひらめき</a></li>
          <li><a href="kirara-letter.html">きららだより</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <div class="page-hero">
      <span class="section-label">THEMES</span>
      <h1 class="page-title">テーマで探す</h1>
      <p class="page-desc">
        好きなテーマから、作品や画像を探せます。<br>
        気になるテーマを選んでみよう。
      </p>
    </div>

    <div class="section">
      <nav class="theme-nav" id="themeNav"></nav>
      <div id="themeSections"></div>
    </div>

  </main>

  <footer class="site-footer">
    <p class="footer-logo">KIRARA MUSE</p>
    <p>© 2026 KIRARA MUSE. All rights reserved.</p>
  </footer>

  <script src="js/main.js?v=2"></script>
  <script>
    async function loadThemes() {
      const [worksRes, imagesRes] = await Promise.all([
        fetch('data/works.json'),
        fetch('data/images.json')
      ]);
      const works  = await worksRes.json();
      const images = await imagesRes.json();

      const themeMap = {};
      works.forEach(w => {
        if (!themeMap[w.theme]) themeMap[w.theme] = { works: [], images: [] };
        themeMap[w.theme].works.push(w);
      });
      images.forEach(img => {
        if (!themeMap[img.theme]) themeMap[img.theme] = { works: [], images: [] };
        themeMap[img.theme].images.push(img);
      });

      const nav = document.getElementById('themeNav');
      nav.innerHTML = Object.entries(themeMap).map(([theme, data]) => {
        const count  = data.works.length + data.images.length;
        const anchor = encodeURIComponent(theme);
        return `<a href="#theme-${anchor}" class="theme-nav-btn">${theme}<span class="theme-count">${count}</span></a>`;
      }).join('');

      const container = document.getElementById('themeSections');
      container.innerHTML = Object.entries(themeMap).map(([theme, data]) => {
        const anchor   = encodeURIComponent(theme);
        const allItems = [
          ...data.works.map(w   => ({ ...w,   kind: 'work'  })),
          ...data.images.map(i  => ({ ...i,   kind: 'image' }))
        ];
        const cards = allItems.map(item => `
          <article class="card${item.kind === 'image' ? ' image-card' : ''}">
            <div class="card-image-wrap">
              ${imageAreaHTML(item.image, item.title)}
              ${makeSaveBtn(item.id, item.image, item.title)}
            </div>
            <div class="card-caption">
              <span class="card-theme">${item.themeEn}</span>
              <p class="card-title">${item.title}</p>
              <p class="card-sub">${item.desc}</p>
            </div>
          </article>`).join('');
        return `
          <div class="theme-section" id="theme-${anchor}">
            <h2 class="theme-section-title">${theme}</h2>
            <div class="theme-card-grid">${cards}</div>
          </div>`;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', loadThemes);
  </script>
</body>
</html>
